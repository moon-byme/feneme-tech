services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-feneme}
      POSTGRES_USER: ${DB_USER:-feneme}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-feneme_local_only}
    ports:
      - "5432:5432"
    volumes:
      - feneme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-feneme} -d ${DB_NAME:-feneme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DB_NAME: ${DB_NAME:-feneme}
      DB_USER: ${DB_USER:-feneme}
      DB_PASSWORD: ${DB_PASSWORD:-feneme_local_only}
      DB_HOST: db
      DB_PORT: 5432
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  feneme_postgres_data:
