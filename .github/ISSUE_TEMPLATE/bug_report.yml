name: Relatar bug
description: Registrar um comportamento incorreto no Feneme.
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Descrição do problema
      description: O que aconteceu?
      placeholder: Descreva o comportamento observado.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Liste os passos para reproduzir o problema.
      placeholder: |
        1. Acessar...
        2. Informar...
        3. Observar...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências e contexto
      description: Inclua mensagens de erro, capturas de tela ou ambiente, se disponíveis.
    validations:
      required: false
