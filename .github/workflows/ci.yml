name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-components:
    name: Detect application components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect backend and frontend
        id: detect
        shell: bash
        run: |
          if [[ -f "backend/manage.py" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "Django backend detected."
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Django backend not detected at backend/manage.py; backend checks will be skipped."
          fi

          if [[ -f "frontend/package.json" ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Frontend detected."
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend not detected at frontend/package.json; frontend checks will be skipped."
          fi

          if [[ ! -f "backend/manage.py" && ! -f "frontend/package.json" ]]; then
            echo "::warning::No application code was detected yet. This run validates the workflow, but does not prove that the application builds or its tests pass."
          fi

  backend:
    name: Backend - Django checks and tests
    runs-on: ubuntu-latest
    needs: detect-components
    if: ${{ needs.detect-components.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f "requirements.txt" ]]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          elif [[ -f "../requirements.txt" ]]; then
            python -m pip install --upgrade pip
            pip install -r ../requirements.txt
          else
            echo "::error::Django was detected, but no requirements.txt was found in backend/ or the repository root."
            exit 1
          fi

      - name: Django system check
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test

  frontend:
    name: Frontend - build and tests
    runs-on: ubuntu-latest
    needs: detect-components
    if: ${{ needs.detect-components.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f "package-lock.json" ]]; then
            npm ci
          else
            echo "::notice::package-lock.json not found; using npm install. Commit package-lock.json for reproducible CI installs."
            npm install
          fi

      - name: Build frontend
        run: |
          node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.build) { console.error('Missing scripts.build in frontend/package.json'); process.exit(1); }"
          npm run build

      - name: Run frontend tests when configured
        shell: bash
        env:
          CI: "true"
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "::warning::No test script is configured in frontend/package.json; frontend tests were skipped."
          fi
