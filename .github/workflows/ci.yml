name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-components:
    name: Detect application components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect backend and frontend
        id: detect
        shell: bash
        run: |
          if [[ -f "backend/manage.py" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "Django backend detected."
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Django backend not detected at backend/manage.py; backend checks will be skipped."
          fi

          if [[ -f "frontend/package.json" ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Frontend detected."
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend not detected at frontend/package.json; frontend checks will be skipped."
          fi

          if [[ ! -f "backend/manage.py" && ! -f "frontend/package.json" ]]; then
            echo "::warning::No application code was detected yet. This run validates the workflow, but does not prove that the application builds or its tests pass."
          fi

  backend:
    name: Backend - Django checks and tests
    runs-on: ubuntu-latest
    needs: detect-components
    if: ${{ needs.detect-components.outputs.backend == 'true' }}
    env:
      DB_NAME: feneme
      DB_USER: feneme
      DB_PASSWORD: feneme_ci_only
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f "requirements.txt" ]]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          elif [[ -f "../requirements.txt" ]]; then
            python -m pip install --upgrade pip
            pip install -r ../requirements.txt
          else
            echo "::error::Django was detected, but no requirements.txt was found in backend/ or the repository root."
            exit 1
          fi

      - name: Set up local PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE feneme LOGIN CREATEDB PASSWORD 'feneme_ci_only';"
          sudo -u postgres createdb --owner=feneme feneme

      - name: Django system check
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test

  frontend:
    name: Frontend - build and tests
    runs-on: ubuntu-latest
    needs: detect-components
    if: ${{ needs.detect-components.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f "package-lock.json" ]]; then
            npm ci
          else
            echo "::notice::package-lock.json not found; using npm install. Commit package-lock.json for reproducible CI installs."
            npm install
          fi

      - name: Build frontend
        run: |
          node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.build) { console.error('Missing scripts.build in frontend/package.json'); process.exit(1); }"
          npm run build

      - name: Run frontend tests when configured
        shell: bash
        env:
          CI: "true"
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "::warning::No test script is configured in frontend/package.json; frontend tests were skipped."
          fi

  e2e-smoke:
    name: E2E - Cucumber/Cypress (@smoke)
    runs-on: ubuntu-latest
    needs: [detect-components, backend, frontend]
    if: ${{ needs.detect-components.outputs.backend == 'true' && needs.detect-components.outputs.frontend == 'true' }}
    env:
      DB_NAME: feneme
      DB_USER: feneme
      DB_PASSWORD: feneme_ci_only
      DB_HOST: localhost
      DB_PORT: "5432"
      DJANGO_DEBUG: "True"
      # Senha apenas das contas fictícias de teste criadas no banco efêmero do CI.
      E2E_PASSWORD: feneme-e2e-ci-only
      CYPRESS_E2E_PASSWORD: feneme-e2e-ci-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up local PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE feneme LOGIN CREATEDB PASSWORD 'feneme_ci_only';"
          sudo -u postgres createdb --owner=feneme feneme

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare database and test accounts
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py seed_e2e_users

      - name: Start Django server
        working-directory: backend
        run: |
          nohup python manage.py runserver 8000 --noreload > ../django-e2e.log 2>&1 &
          npx --yes wait-on@8 --timeout 60000 http-get://localhost:8000/

      - name: Run @smoke scenarios
        working-directory: frontend
        run: npm run e2e:smoke

      - name: Run route comparison scenarios (@US-07)
        working-directory: frontend
        run: npm run e2e:routes

      - name: Run Sprint 1 regression (@R1)
        working-directory: frontend
        run: npm run e2e:r1

      - name: Run Open-Meteo scenarios (@US-08)
        working-directory: frontend
        run: npm run e2e:weather

      - name: Run complete Release 2 regression (@R2)
        working-directory: frontend
        run: npm run e2e -- --env tags="@R2"

      - name: Upload Cucumber report and failure screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-regression-report
          path: |
            frontend/cypress/reports/
            frontend/cypress/screenshots/
            django-e2e.log
          if-no-files-found: ignore
          retention-days: 30

  secret-scan:
    name: Segurança - segredos fora do repositório
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Procurar chaves e credenciais versionadas
        shell: bash
        run: |
          # Chaves do Google (AIza...), chaves privadas e URLs de banco com senha (FT-110, FT-115, R10).
          pattern='AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----|postgres(ql)?://[^:/@[:space:]]+:[^@[:space:]]+@[^[:space:]]*render\.com'
          if git grep -nIE "$pattern" -- . ':!*.lock' ':!package-lock.json'; then
            echo "::error::Possível segredo versionado encontrado. Remova-o, revogue a chave e registre em FT-103."
            exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::O arquivo .env está versionado."
            exit 1
          fi
          echo "Nenhum segredo encontrado nos arquivos versionados."

  deploy-homologacao:
    name: Deploy - homologação (Render)
    runs-on: ubuntu-latest
    # Só depois que todos os testes passarem, e só em push na main (FT-110).
    needs: [backend, frontend, e2e-smoke, secret-scan]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: deploy-homologacao
      cancel-in-progress: false
    environment: homologacao
    steps:
      - name: Disparar o deploy no Render
        id: trigger
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL não configurado; deploy de homologação ignorado. Ver docs/devops/homologacao.md."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${RENDER_DEPLOY_HOOK_URL}?ref=${GITHUB_SHA}")
          echo "Render respondeu HTTP ${status} ao Deploy Hook."
          [[ "$status" =~ ^2 ]] || { echo "::error::O Render recusou o Deploy Hook."; exit 1; }

      - name: Aguardar a nova versão no ar
        if: ${{ steps.trigger.outputs.skipped != 'true' && vars.HOMOLOGACAO_URL != '' }}
        env:
          HOMOLOGACAO_URL: ${{ vars.HOMOLOGACAO_URL }}
        shell: bash
        run: |
          # O plano gratuito compila em alguns minutos e hiberna sem uso; espera até 20 min.
          for attempt in $(seq 1 40); do
            body=$(curl -sS --max-time 30 "${HOMOLOGACAO_URL%/}/api/health/" || true)
            echo "Tentativa ${attempt}: ${body}"
            if [[ "$body" == *"\"status\":\"ok\""* && "$body" == *"${GITHUB_SHA}"* ]]; then
              echo "Homologação no ar com o commit ${GITHUB_SHA}: ${HOMOLOGACAO_URL}"
              echo "### Homologação atualizada" >> "$GITHUB_STEP_SUMMARY"
              echo "- URL: ${HOMOLOGACAO_URL}" >> "$GITHUB_STEP_SUMMARY"
              echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::A homologação não respondeu com o commit ${GITHUB_SHA} em 20 minutos."
          exit 1
